name: Codex exec
description: Run one repository prompt with the OpenAI Codex GitHub Action.
inputs:
  openai-api-key:
    description: OpenAI API key used by the Codex responses proxy
    required: true
  prompt-file:
    description: Prompt file relative to the repository root
    required: true
  output-file:
    description: File that receives the final Codex message
    required: true
  codex-args:
    description: |
      JSON array of extra arguments forwarded to `codex exec`.
      Only flags listed by `codex exec --help` are valid. `--ask-for-approval`
      and `--search` belong to the interactive CLI and fail `codex exec`.
      Leave this empty: non-interactive exec already uses approval=never, and
      this action sets the model, effort, and sandbox.
    required: false
    default: "[]"
runs:
  using: composite
  steps:
    - name: Run Codex
      uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        prompt-file: ${{ inputs.prompt-file }}
        output-file: ${{ inputs.output-file }}
        output-schema-file: .github/automation/codex-result.schema.json
        model: gpt-5.6-sol
        effort: high
        sandbox: danger-full-access
        safety-strategy: drop-sudo
        codex-args: ${{ inputs.codex-args }}
        allow-bots: "true"
      env:
        # The action's own write-access check sets GITHUB_TOKEN from github.token.
        # Blank it for the Codex process so the model does not inherit a credential.
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
