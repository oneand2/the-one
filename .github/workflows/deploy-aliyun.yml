name: Deploy to Aliyun

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aliyun-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ikiznnuenehlutcjpukd.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_OYt-uH0GcjByAVS4n5yygA_HEBcV04Z \
            --build-arg NEXT_PUBLIC_SITE_URL=https://www.the-one-and-the-two.com \
            --build-arg NEXT_PUBLIC_OPERATOR_NAME="${{ vars.OPERATOR_NAME }}" \
            --build-arg NEXT_PUBLIC_CUSTOMER_SERVICE_EMAIL="${{ vars.CUSTOMER_SERVICE_EMAIL }}" \
            --build-arg NEXT_PUBLIC_ICP_NUMBER="${{ vars.ICP_NUMBER }}" \
            --build-arg NEXT_PUBLIC_PUBLIC_SECURITY_NUMBER="${{ vars.PUBLIC_SECURITY_NUMBER }}" \
            -t the-one-app:latest .

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: 47.116.143.76
          DEPLOY_USER: admin
          DEPLOY_KEY: ${{ secrets.ALIYUN_SSH_KEYC }}
          DEPLOY_PATH: /opt/the-one
          ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
          ALIPAY_SELLER_ID: ${{ secrets.ALIPAY_SELLER_ID }}
          ALIPAY_PRIVATE_KEY_BASE64: ${{ secrets.ALIPAY_PRIVATE_KEY_BASE64 }}
          ALIPAY_PUBLIC_KEY_BASE64: ${{ secrets.ALIPAY_PUBLIC_KEY_BASE64 }}
          WECHAT_PAY_APP_ID: ${{ secrets.WECHAT_PAY_APP_ID }}
          WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
          WECHAT_PAY_API_V3_KEY: ${{ secrets.WECHAT_PAY_API_V3_KEY }}
          WECHAT_PAY_PRIVATE_KEY_BASE64: ${{ secrets.WECHAT_PAY_PRIVATE_KEY_BASE64 }}
          WECHAT_PAY_CERT_SERIAL_NO: ${{ secrets.WECHAT_PAY_CERT_SERIAL_NO }}
          WECHAT_PAY_PUBLIC_KEY_BASE64: ${{ secrets.WECHAT_PAY_PUBLIC_KEY_BASE64 }}
          WECHAT_PAY_PUBLIC_KEY_ID: ${{ secrets.WECHAT_PAY_PUBLIC_KEY_ID }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_PATH"
          test -n "$ALIPAY_APP_ID"
          test -n "$ALIPAY_SELLER_ID"
          test -n "$ALIPAY_PRIVATE_KEY_BASE64"
          test -n "$ALIPAY_PUBLIC_KEY_BASE64"
          test -n "$WECHAT_PAY_APP_ID"
          test -n "$WECHAT_PAY_MCH_ID"
          test -n "$WECHAT_PAY_API_V3_KEY"
          test -n "$WECHAT_PAY_PRIVATE_KEY_BASE64"
          test -n "$WECHAT_PAY_CERT_SERIAL_NO"
          test -n "$WECHAT_PAY_PUBLIC_KEY_BASE64"
          test -n "$WECHAT_PAY_PUBLIC_KEY_ID"

          PAYMENT_ENV_FILE="$RUNNER_TEMP/payment-production.env"
          umask 077
          {
            printf 'ALIPAY_APP_ID=%s\n' "$ALIPAY_APP_ID"
            printf 'ALIPAY_SELLER_ID=%s\n' "$ALIPAY_SELLER_ID"
            printf 'ALIPAY_PRIVATE_KEY_BASE64=%s\n' "$ALIPAY_PRIVATE_KEY_BASE64"
            printf 'ALIPAY_PUBLIC_KEY_BASE64=%s\n' "$ALIPAY_PUBLIC_KEY_BASE64"
            printf 'ALIPAY_KEY_TYPE=PKCS8\n'
            printf 'WECHAT_PAY_APP_ID=%s\n' "$WECHAT_PAY_APP_ID"
            printf 'WECHAT_PAY_MCH_ID=%s\n' "$WECHAT_PAY_MCH_ID"
            printf 'WECHAT_PAY_API_V3_KEY=%s\n' "$WECHAT_PAY_API_V3_KEY"
            printf 'WECHAT_PAY_PRIVATE_KEY_BASE64=%s\n' "$WECHAT_PAY_PRIVATE_KEY_BASE64"
            printf 'WECHAT_PAY_CERT_SERIAL_NO=%s\n' "$WECHAT_PAY_CERT_SERIAL_NO"
            printf 'WECHAT_PAY_PUBLIC_KEY_BASE64=%s\n' "$WECHAT_PAY_PUBLIC_KEY_BASE64"
            printf 'WECHAT_PAY_PUBLIC_KEY_ID=%s\n' "$WECHAT_PAY_PUBLIC_KEY_ID"
          } > "$PAYMENT_ENV_FILE"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/aliyun_deploy_key"
          chmod 600 "$HOME/.ssh/aliyun_deploy_key"

          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/aliyun_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; \
             sudo mkdir -p '$DEPLOY_PATH/backups'; \
             BACKUP_DIR='$DEPLOY_PATH/backups/auto-before-deploy-'\$(date +%Y%m%d-%H%M%S); \
             sudo mkdir -p \"\$BACKUP_DIR\"; \
             if test -f '$DEPLOY_PATH/nginx.conf'; then sudo cp '$DEPLOY_PATH/nginx.conf' \"\$BACKUP_DIR/nginx.conf\"; fi; \
             if test -f '$DEPLOY_PATH/docker-compose.yml'; then sudo cp '$DEPLOY_PATH/docker-compose.yml' \"\$BACKUP_DIR/docker-compose.yml\"; fi"

          scp -i "$HOME/.ssh/aliyun_deploy_key" "$PAYMENT_ENV_FILE" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/payment-production.env"

          ssh -i "$HOME/.ssh/aliyun_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; \
             sudo touch '$DEPLOY_PATH/.env.production'; \
             sudo cp '$DEPLOY_PATH/.env.production' '$DEPLOY_PATH/backups/env-production-before-payment-sync'; \
             sudo sed -i -e '/^ALIPAY_/d' -e '/^WECHAT_PAY_/d' '$DEPLOY_PATH/.env.production'; \
             sudo sh -c \"printf '\\n' >> '$DEPLOY_PATH/.env.production'; cat /tmp/payment-production.env >> '$DEPLOY_PATH/.env.production'\"; \
             rm -f /tmp/payment-production.env"

          docker save the-one-app:latest | gzip \
            | ssh -i "$HOME/.ssh/aliyun_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
              "gunzip | sudo docker load"

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            --exclude='android/.gradle' \
            --exclude='android/app/build' \
            --exclude='android/build' \
            -czf - . \
            | ssh -i "$HOME/.ssh/aliyun_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
              "sudo tar -xzf - -C '$DEPLOY_PATH'"

          ssh -i "$HOME/.ssh/aliyun_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
          set -eu
          sudo docker compose --project-directory "$DEPLOY_PATH" --env-file "$DEPLOY_PATH/.env.production" config --quiet
          sudo docker exec the-one-nginx-1 nginx -t
          sudo docker compose --project-directory "$DEPLOY_PATH" --env-file "$DEPLOY_PATH/.env.production" up -d --no-build --remove-orphans
          curl --fail --silent --show-error --max-time 20 --insecure \
            --resolve www.the-one-and-the-two.com:443:127.0.0.1 \
            https://www.the-one-and-the-two.com/ > /dev/null
          sudo docker compose --project-directory "$DEPLOY_PATH" ps
          EOF
