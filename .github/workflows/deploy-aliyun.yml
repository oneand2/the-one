name: Deploy to Aliyun

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aliyun-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ikiznnuenehlutcjpukd.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_OYt-uH0GcjByAVS4n5yygA_HEBcV04Z \
            --build-arg NEXT_PUBLIC_SITE_URL=https://www.the-one-and-the-two.com \
            -t the-one-app:latest .

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: 47.116.143.76
          DEPLOY_USER: admin
          DEPLOY_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          DEPLOY_PATH: /opt/the-one
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_PATH"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/aliyun_deploy_key"
          chmod 600 "$HOME/.ssh/aliyun_deploy_key"

          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/aliyun_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; \
             sudo mkdir -p '$DEPLOY_PATH/backups'; \
             BACKUP_DIR='$DEPLOY_PATH/backups/auto-before-deploy-'\$(date +%Y%m%d-%H%M%S); \
             sudo mkdir -p \"\$BACKUP_DIR\"; \
             if test -f '$DEPLOY_PATH/nginx.conf'; then sudo cp '$DEPLOY_PATH/nginx.conf' \"\$BACKUP_DIR/nginx.conf\"; fi; \
             if test -f '$DEPLOY_PATH/docker-compose.yml'; then sudo cp '$DEPLOY_PATH/docker-compose.yml' \"\$BACKUP_DIR/docker-compose.yml\"; fi"

          docker save the-one-app:latest | gzip \
            | ssh -i "$HOME/.ssh/aliyun_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
              "gunzip | sudo docker load"

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            --exclude='android/.gradle' \
            --exclude='android/app/build' \
            --exclude='android/build' \
            -czf - . \
            | ssh -i "$HOME/.ssh/aliyun_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
              "sudo tar -xzf - -C '$DEPLOY_PATH'"

          ssh -i "$HOME/.ssh/aliyun_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
          set -eu
          sudo docker compose --project-directory "$DEPLOY_PATH" --env-file "$DEPLOY_PATH/.env.production" config --quiet
          sudo docker exec the-one-nginx-1 nginx -t
          sudo docker compose --project-directory "$DEPLOY_PATH" --env-file "$DEPLOY_PATH/.env.production" up -d --no-build --remove-orphans
          curl --fail --silent --show-error --max-time 20 --insecure \
            --resolve www.the-one-and-the-two.com:443:127.0.0.1 \
            https://www.the-one-and-the-two.com/ > /dev/null
          sudo docker compose --project-directory "$DEPLOY_PATH" ps
          EOF
