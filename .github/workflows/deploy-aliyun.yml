name: Deploy to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    concurrency:
      group: aliyun-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment tools
        run: |
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
          bash -n scripts/deploy/release.sh scripts/deploy/rollback.sh
          sh -n scripts/deploy/renew-certificate.sh

      - name: Compare with healthy production release
        id: plan
        run: python3 scripts/deploy/plan-release.py

      - name: Set up Docker Buildx
        if: steps.plan.outputs.publish == 'true'
        id: builder
        uses: docker/setup-buildx-action@v3

      - name: Restore Next.js compiler cache
        if: steps.plan.outputs.publish == 'true'
        id: next_cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: next-compile-cache
          key: ${{ runner.os }}-next-compile-v1-${{ hashFiles('package-lock.json', 'next.config.ts', 'Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-compile-v1-${{ hashFiles('package-lock.json', 'next.config.ts', 'Dockerfile') }}-

      # Docker's gha layer cache does not persist RUN cache mounts by itself.
      - name: Restore compiler cache into Docker
        continue-on-error: true
        if: steps.plan.outputs.publish == 'true'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          cache-map: '{"next-compile-cache":{"target":"/app/.next/cache","id":"next-compile-v1"}}'
          skip-extraction: ${{ steps.next_cache.outputs.cache-hit }}

      - name: Sign in to GitHub Container Registry
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build minimal production image
        if: steps.plan.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ghcr.io/oneand2/the-one:${{ github.sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=the-one-production
          cache-to: type=gha,mode=max,scope=the-one-production,ignore-error=true
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=https://ikiznnuenehlutcjpukd.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_OYt-uH0GcjByAVS4n5yygA_HEBcV04Z
            NEXT_PUBLIC_SITE_URL=https://www.the-one-and-the-two.com
            NEXT_PUBLIC_OPERATOR_NAME=${{ vars.OPERATOR_NAME }}
            NEXT_PUBLIC_CUSTOMER_SERVICE_EMAIL=${{ vars.CUSTOMER_SERVICE_EMAIL }}
            NEXT_PUBLIC_ICP_NUMBER=${{ vars.ICP_NUMBER }}
            NEXT_PUBLIC_PUBLIC_SECURITY_NUMBER=${{ vars.PUBLIC_SECURITY_NUMBER }}

      - name: Read published image manifest
        if: steps.plan.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/metrics"
          docker buildx imagetools inspect --raw "ghcr.io/oneand2/the-one:$GITHUB_SHA" > "$RUNNER_TEMP/metrics/manifest.json"

      - name: Save build measurements and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metrics-${{ github.sha }}
          path: ${{ runner.temp }}/metrics/
          retention-days: 30

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    # A new build can replace an obsolete build, never an active cutover.
    concurrency:
      group: aliyun-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Skip superseded release
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$latest"
          if test "$latest" = "$GITHUB_SHA"; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this obsolete release will not replace production.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download image manifest
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-metrics-${{ github.sha }}
          path: ${{ runner.temp }}/metrics/

      - name: Pull changed layers and release
        if: steps.current.outputs.publish == 'true'
        env:
          DEPLOY_HOST: 47.116.143.76
          DEPLOY_USER: admin
          DEPLOY_KEY: ${{ secrets.ALIYUN_SSH_KEYC }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: /opt/the-one
          ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
          ALIPAY_SELLER_ID: ${{ secrets.ALIPAY_SELLER_ID }}
          ALIPAY_PRIVATE_KEY_BASE64: ${{ secrets.ALIPAY_PRIVATE_KEY_BASE64 }}
          ALIPAY_PUBLIC_KEY_BASE64: ${{ secrets.ALIPAY_PUBLIC_KEY_BASE64 }}
          WECHAT_PAY_APP_ID: ${{ secrets.WECHAT_PAY_APP_ID }}
          WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
          WECHAT_PAY_API_V3_KEY: ${{ secrets.WECHAT_PAY_API_V3_KEY }}
          WECHAT_PAY_PRIVATE_KEY_BASE64: ${{ secrets.WECHAT_PAY_PRIVATE_KEY_BASE64 }}
          WECHAT_PAY_CERT_SERIAL_NO: ${{ secrets.WECHAT_PAY_CERT_SERIAL_NO }}
          WECHAT_PAY_PUBLIC_KEY_BASE64: ${{ secrets.WECHAT_PAY_PUBLIC_KEY_BASE64 }}
          WECHAT_PAY_PUBLIC_KEY_ID: ${{ secrets.WECHAT_PAY_PUBLIC_KEY_ID }}
          WECHAT_LOGIN_APP_ID: ${{ secrets.WECHAT_LOGIN_APP_ID }}
          WECHAT_LOGIN_APP_SECRET: ${{ secrets.WECHAT_LOGIN_APP_SECRET }}
          WECHAT_MINIPROGRAM_APP_ID: ${{ secrets.WECHAT_MINIPROGRAM_APP_ID }}
          WECHAT_MINIPROGRAM_APP_SECRET: ${{ secrets.WECHAT_MINIPROGRAM_APP_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_PATH"
          test -n "$ALIPAY_APP_ID"
          test -n "$ALIPAY_SELLER_ID"
          test -n "$ALIPAY_PRIVATE_KEY_BASE64"
          test -n "$ALIPAY_PUBLIC_KEY_BASE64"
          test -n "$WECHAT_PAY_APP_ID"
          test -n "$WECHAT_PAY_MCH_ID"
          test -n "$WECHAT_PAY_API_V3_KEY"
          test -n "$WECHAT_PAY_PRIVATE_KEY_BASE64"
          test -n "$WECHAT_PAY_CERT_SERIAL_NO"
          test -n "$WECHAT_PAY_PUBLIC_KEY_BASE64"
          test -n "$WECHAT_PAY_PUBLIC_KEY_ID"

          PAYMENT_ENV_FILE="$RUNNER_TEMP/payment-production.env"
          umask 077
          {
            printf 'ALIPAY_APP_ID=%s\n' "$ALIPAY_APP_ID"
            printf 'ALIPAY_SELLER_ID=%s\n' "$ALIPAY_SELLER_ID"
            printf 'ALIPAY_PRIVATE_KEY_BASE64=%s\n' "$ALIPAY_PRIVATE_KEY_BASE64"
            printf 'ALIPAY_PUBLIC_KEY_BASE64=%s\n' "$ALIPAY_PUBLIC_KEY_BASE64"
            printf 'ALIPAY_KEY_TYPE=PKCS8\n'
            printf 'WECHAT_PAY_APP_ID=%s\n' "$WECHAT_PAY_APP_ID"
            printf 'WECHAT_PAY_MCH_ID=%s\n' "$WECHAT_PAY_MCH_ID"
            printf 'WECHAT_PAY_API_V3_KEY=%s\n' "$WECHAT_PAY_API_V3_KEY"
            printf 'WECHAT_PAY_PRIVATE_KEY_BASE64=%s\n' "$WECHAT_PAY_PRIVATE_KEY_BASE64"
            printf 'WECHAT_PAY_CERT_SERIAL_NO=%s\n' "$WECHAT_PAY_CERT_SERIAL_NO"
            printf 'WECHAT_PAY_PUBLIC_KEY_BASE64=%s\n' "$WECHAT_PAY_PUBLIC_KEY_BASE64"
            printf 'WECHAT_PAY_PUBLIC_KEY_ID=%s\n' "$WECHAT_PAY_PUBLIC_KEY_ID"
            printf 'APPLE_BUNDLE_ID=%s\n' 'com.theone.er'
            printf 'APPLE_APP_ID=%s\n' '6801478964'
            printf 'APPLE_IAP_ALLOW_XCODE=%s\n' 'false'
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' 'https://www.the-one-and-the-two.com'
            if test -n "${WECHAT_LOGIN_APP_ID:-}" && test -n "${WECHAT_LOGIN_APP_SECRET:-}"; then
              printf 'WECHAT_LOGIN_APP_ID=%s\n' "$WECHAT_LOGIN_APP_ID"
              printf 'WECHAT_LOGIN_APP_SECRET=%s\n' "$WECHAT_LOGIN_APP_SECRET"
            fi
            if test -n "${WECHAT_MINIPROGRAM_APP_ID:-}" && test -n "${WECHAT_MINIPROGRAM_APP_SECRET:-}"; then
              printf 'WECHAT_MINIPROGRAM_APP_ID=%s\n' "$WECHAT_MINIPROGRAM_APP_ID"
              printf 'WECHAT_MINIPROGRAM_APP_SECRET=%s\n' "$WECHAT_MINIPROGRAM_APP_SECRET"
            fi
            if test -n "${SMTP_HOST:-}" && test -n "${SMTP_USER:-}" && test -n "${SMTP_PASS:-}"; then
              printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
              printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-465}"
              printf 'SMTP_USER=%s\n' "$SMTP_USER"
              printf 'SMTP_PASS=%s\n' "$SMTP_PASS"
              printf 'SMTP_FROM=%s\n' "${SMTP_FROM:-$SMTP_USER}"
            fi
          } > "$PAYMENT_ENV_FILE"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/aliyun_deploy_key"
          chmod 600 "$HOME/.ssh/aliyun_deploy_key"

          ssh-keyscan -T 5 -t ed25519 -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"


          SSH="ssh -o ControlMaster=auto -o ControlPath=$RUNNER_TEMP/aliyun-control -o ControlPersist=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i $HOME/.ssh/aliyun_deploy_key"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          INCOMING="$DEPLOY_PATH/incoming/$GITHUB_SHA"
          $SSH "$REMOTE" "sudo install -d -m 700 '$INCOMING'"
          # This job's short-lived token expires after the job; no permanent
          # registry credential is installed on ECS.
          printf '%s' "$GHCR_TOKEN" > "$RUNNER_TEMP/registry-token"
          started=$(date +%s)
          rsync -rt -e "$SSH" --rsync-path='sudo rsync' \
            "$RUNNER_TEMP/metrics/manifest.json" "$PAYMENT_ENV_FILE" "$RUNNER_TEMP/registry-token" \
            scripts/deploy/release.sh scripts/deploy/rollback.sh scripts/deploy/cleanup.py scripts/deploy/renew-certificate.sh \
            "$REMOTE:$INCOMING/"
          $SSH "$REMOTE" "sudo bash '$INCOMING/release.sh' '$GITHUB_SHA'"
          $SSH "$REMOTE" "sudo cat '$DEPLOY_PATH/releases/$GITHUB_SHA/result.json'" > "$RUNNER_TEMP/metrics/release.json"
          echo "Pull and release: $(( $(date +%s) - started )) seconds" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/metrics/release.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public HTTPS release
        if: steps.current.outputs.publish == 'true'
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            https://www.the-one-and-the-two.com/api/health > "$RUNNER_TEMP/health.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/health.json"))["release"] == os.environ["EXPECTED_RELEASE"]'

      - name: Save deployment measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metrics-${{ github.sha }}
          path: ${{ runner.temp }}/metrics/
          retention-days: 30

      - name: Remove runner credentials
        if: always()
        run: |
          ssh -S "$RUNNER_TEMP/aliyun-control" -O exit admin@47.116.143.76 2>/dev/null || true
          rm -f "$RUNNER_TEMP/payment-production.env" "$RUNNER_TEMP/registry-token" "$HOME/.ssh/aliyun_deploy_key"
