name: 今日见闻

on:
  workflow_dispatch:

concurrency:
  group: daily-jinri-jianwen
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  main-only:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse runs outside main
        run: |
          echo "今日见闻只在 main 上运行。" >&2
          exit 1

  edit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Write read-only Supabase environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/automation/content_automation.py write-env .env.local \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY

      - name: Prepare prompt
        run: |
          set -euo pipefail
          mkdir -p .codex-run
          python3 scripts/automation/content_automation.py preface \
            jinri-jianwen \
            .github/automation/prompts/jinri-jianwen.txt \
            .codex-run/prompt.txt

      # Responses API tool loop: hosted web_search plus local shell and apply_patch.
      # CONTENT_MODEL is the documented default, not a new secret. GITHUB_TOKEN is
      # blank so the model cannot use the workflow token.
      - name: Run OpenAI content agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTENT_MODEL: gpt-6.2-sol
          CONTENT_REASONING_EFFORT: high
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: python3 scripts/automation/openai_content_runner.py --task jinri-jianwen --prompt .codex-run/prompt.txt --output .codex-run/result.json

      - name: Collect content changes
        run: |
          set -euo pipefail
          python3 scripts/automation/content_automation.py collect \
            jinri-jianwen .codex-run/result.json .codex-run/changes.patch
          status=$(python3 scripts/automation/content_automation.py print-field .codex-run/result.json status)
          if [ "$status" = "failed" ]; then
            python3 scripts/automation/content_automation.py write-summary \
              --title "今日见闻" \
              --result .codex-run/result.json \
              --line "模型报告失败。未推送 main，未写入数据库。"
            exit 1
          fi

      - name: Upload agent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jinri-jianwen-${{ github.run_id }}
          path: |
            .codex-run/result.json
            .codex-run/changes.patch
            .codex-run/runner.log
          retention-days: 14
          if-no-files-found: warn

      - name: Write failure summary
        if: failure()
        run: |
          if [ -f .codex-run/summary-written ]; then
            exit 0
          fi
          python3 scripts/automation/content_automation.py write-summary \
            --title "今日见闻" \
            --result .codex-run/result.json \
            --line "任务在完成前失败。未推送 main，未写入数据库。"

  publish:
    needs: edit
    if: needs.edit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download agent result
        uses: actions/download-artifact@v4
        with:
          name: jinri-jianwen-${{ github.run_id }}
          path: .codex-run

      - name: Commit, deploy, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/automation/publish-insights.sh .codex-run/changes.patch .codex-run/result.json
