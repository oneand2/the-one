<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf9f4">
  <title>见天地</title>
  <meta name="description" content="《见天地》新闻刊期与报道。">
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="paper.css">
  <script src="paper.js" defer></script>
</head>
<body>
  <svg class="sprites" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-find" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M6.5 4h11v16.2L12 16.5l-5.5 3.7Z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M20 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m4 17 6-6 4 4 3-3 4 4"/><circle cx="15.5" cy="9" r="1"/></symbol>
  </svg>
  <a href="#content" class="skip">跳至正文</a>
  <div class="paper">
    <header>
      <a class="app-return" id="app-return" hidden><svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg>返回见天地</a>
      <div class="mast">
        <a class="mast-brand" href="#front" aria-label="见天地，返回头版">
          <img class="brand-mark" src="mark.svg" width="32" height="32" alt="">
          <span class="brand-cn">见天地</span><span class="brand-en" lang="zh-Latn">JIAN TIAN DI</span>
        </a>
        <div class="dateline">
          <button class="edition-picker" id="edition-trigger" type="button" aria-label="切换刊期" aria-expanded="false" aria-controls="edition-panel" disabled>
            <span class="edition-trigger-line">
              <time>刊期</time>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4.5 4 4 4-4"/></svg>
            </span>
            <small><span id="edition-weekday"></span><span id="edition-lunar"></span></small>
          </button>
          <section class="edition-panel" id="edition-panel" aria-label="刊期归档" hidden>
            <div class="edition-month-bar">
              <h2 id="edition-month" aria-live="polite"></h2>
              <div id="edition-month-controls" class="edition-month-controls" hidden>
                <button type="button" id="edition-older" aria-label="上一个有刊期的月份"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 3-5 5 5 5"/></svg></button>
                <button type="button" id="edition-newer" aria-label="下一个有刊期的月份"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
              </div>
            </div>
            <ul class="edition-days" id="edition-days" aria-labelledby="edition-month"></ul>
          </section>
        </div>
      </div>
      <div class="navline">
        <nav aria-label="新闻版面" id="sections">
          <a href="#front" data-section="front">今日头版</a>
          <a href="#section/world" data-section="world">国际</a>
          <a href="#section/science" data-section="science">AI 科技</a>
          <a href="#section/finance" data-section="finance">金融</a>
          <a href="#section/domestic" data-section="domestic">民生</a>
          <a href="#section/culture" data-section="culture">艺术</a>
        </nav>
        <div class="tools">
          <button type="button" id="open-search" aria-label="搜索本期新闻"><svg class="icon"><use href="#i-find"/></svg><span>搜索</span></button>
          <a href="#saved" id="open-saved" aria-label="我的收藏"><svg class="icon"><use href="#i-save"/></svg><span>收藏</span></a>
        </div>
      </div>
    </header>
    <main id="content" tabindex="-1" aria-busy="true"><div class="empty"><p>正在读取刊期…</p></div></main>
    <noscript><p>请启用 JavaScript 阅读新闻并切换刊期。</p></noscript>
    <footer><a href="#front" class="foot-brand">见天地</a><span lang="zh-Latn">JIAN TIAN DI</span><time></time></footer>
  </div>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <div class="dialog-head"><h2 id="search-title">搜索本期</h2><button type="button" class="round" id="close-search" aria-label="关闭搜索"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <label class="find-field"><svg class="icon"><use href="#i-find"/></svg><input id="query" type="search" placeholder="输入标题、地点或关键词" aria-label="新闻关键词" autocomplete="off"></label>
    <p class="result-count" id="result-count" aria-live="polite"></p><div id="search-list" class="search-list"></div>
  </dialog>
</body>
</html>
